# ==========================================
# APPLICATION
# ==========================================

spring.application.name=bq_auth

server.port=9012


# ==========================================
# POSTGRESQL
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/bq_auth_db

spring.datasource.username=postgres

spring.datasource.password=postgres123


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# EUREKA
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:9010/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


# ==========================================
# JWT
# ==========================================

jwt.secret=MyVerySecretKeyForLogisticsProject2026MyVerySecretKey

jwt.expiration=86400000
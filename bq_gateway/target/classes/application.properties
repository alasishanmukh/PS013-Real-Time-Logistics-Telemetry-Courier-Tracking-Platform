spring.application.name=bq_gateway
# ==========================================
# APPLICATION
# ==========================================



server.port=9011


# ==========================================
# EUREKA
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:9010/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


# ==========================================
# GATEWAY ROUTES
# ==========================================

# AUTH SERVICE
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://bq_auth
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**


# SHIPMENT SERVICE
spring.cloud.gateway.routes[1].id=shipment-service
spring.cloud.gateway.routes[1].uri=lb://bq_shipment
spring.cloud.gateway.routes[1].predicates[0]=Path=/shipments/**


# TRACKING SERVICE
spring.cloud.gateway.routes[2].id=tracking-service
spring.cloud.gateway.routes[2].uri=lb://bq_tracking
spring.cloud.gateway.routes[2].predicates[0]=Path=/tracking/**


# NOTIFICATION SERVICE
spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://bq_notification
spring.cloud.gateway.routes[3].predicates[0]=Path=/notifications/**